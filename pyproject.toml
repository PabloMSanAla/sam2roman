[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam2roman"
version = "0.1.0"
description = "SAM 2 (Segment Anything Model 2) inference and training pipeline for Roman Space Telescope and astronomical FITS images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Roman SAM 2 Team" }
]
keywords = [
    "astronomy",
    "segmentation",
    "sam2",
    "segment-anything",
    "roman-space-telescope",
    "fits",
    "deep-learning",
    "pytorch",
    "huggingface"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.50.0",
    "huggingface_hub>=0.24.0",
    "accelerate>=0.30.0",
    "astropy>=6.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "photutils>=1.12.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
